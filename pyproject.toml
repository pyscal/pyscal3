[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11>=2.12",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyscal3"
version = "4.0.0"
description = "Python library written in C++ for calculation of local atomic structural environment"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Sarath Menon", email = "sarath.menon@pyscal.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["atomic structure", "steinhardt", "descriptors", "molecular dynamics", "materials science"]

dependencies = [
    "numpy",
    "ase",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "scipy",
    "spglib",
]
structures = [
    "scipy",
    "spglib",
]
all = [
    "scipy",
    "spglib",
]

[project.urls]
Homepage = "https://pyscal.org"
Documentation = "https://pyscal.org"
Repository = "https://github.com/pyscal/pyscal3"
Issues = "https://github.com/pyscal/pyscal3/issues"
Changelog = "https://github.com/pyscal/pyscal3/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyscal3" = ["data/*.yaml"]

# Exclude C++ source files from wheel — they're only needed for building
[tool.setuptools.exclude-package-data]
"pyscal3" = ["*.cpp", "*.h", "*.cc", "*.hh"]

# ---------------------------------------------------------------------------
# cibuildwheel
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# Build CPython 3.10 – 3.13, skip PyPy and musl
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_*"

test-requires = ["pytest", "ase", "pyyaml", "scipy", "spglib"]
test-command = "pytest {project}/tests --ignore={project}/tests/_old_tests -x -q"

[tool.cibuildwheel.linux]
# Build x86_64 and aarch64; skip testing aarch64 (QEMU too slow)
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-test = "pip install --upgrade pip"
test-skip = "*-manylinux_aarch64"

[tool.cibuildwheel.macos]
# Build both Intel and Apple Silicon; skip testing x86_64 on arm64 runner
archs = ["x86_64", "arm64"]
test-skip = "*-macosx_x86_64"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/_old_tests"


name: Build and publish to PyPI

on:
  # Build on every push to main (but only publish on release)
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publish job adds id-token for trusted publishing.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # Build wheels for all platforms
  # ===========================================================================
  build_wheels:
    name: Wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the current Apple-silicon runner (macos-14 is deprecated);
        # cibuildwheel cross-compiles the x86_64 wheels there.
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ===========================================================================
  # Build source distribution
  # ===========================================================================
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # ===========================================================================
  # Publish to PyPI (only on GitHub Release)
  # ===========================================================================
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    # OIDC trusted publishing — no API token needed
    # Configure at: https://pypi.org/manage/project/pyscal3/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/p/pyscal3
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
